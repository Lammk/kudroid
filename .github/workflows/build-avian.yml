name: Build Avian JVM (iOS)

# Builds the Avian JVM for iOS ARM64 and uploads the static library +
# bootimage as an artifact. This replaces the miniJVM dependency.
#
# Avian uses its own Makefile (not CMake). It needs:
#   - macOS runner (has Xcode + iPhoneOS SDK)
#   - A JDK (JAVA_HOME) to build the bootimage (javac/jar)
#
# Usage: make platform=ios arch=arm64 use-clang=true

on:
  workflow_dispatch:
  push:
    paths:
      - 'third_party/jvm/avian/**'
      - '.github/workflows/build-avian.yml'

jobs:
  build-avian-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'
          # Avian's classpath build uses `javac -source 1` which was removed
          # in JDK 9+. JDK 8 is required to build the bootimage/classpath.
          # Zulu provides JDK 8 for macOS ARM64 (Temurin does not).

      - name: Verify toolchain
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== JDK ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Avian build
        id: avian-cache
        uses: actions/cache@v4
        with:
          path: third_party/jvm/avian/build
          key: avian-ios-arm64-${{ runner.os }}-${{ hashFiles('third_party/jvm/avian/makefile') }}
          restore-keys: |
            avian-ios-arm64-${{ runner.os }}-

      - name: Build Avian for iOS ARM64
        working-directory: third_party/jvm/avian
        run: |
          # Patch the makefile to use `ld -r -sectcreate` + an assembly symbol
          # file instead of the binaryToObject tool (which produces an object
          # with architecture 'unknown' on iOS/macho).
          python3 - << 'PYEOF'
          import re
          with open('makefile', 'r') as f:
              content = f.read()
          old = """$(classpath-object): $(build)/classpath.jar $(converter)
\t@echo "creating $(@)"
\t$(converter) $(<) $(@) _binary_classpath_jar_start \\
\t\t_binary_classpath_jar_end $(target-format) $(arch)"""
          new = """$(classpath-object): $(build)/classpath.jar
\t@echo "creating $(@) via ld -r -sectcreate"
\tld -r -sectcreate __TEXT __kudroid_classpath $(<) -o $(@) -arch $(arch)"""
          if old in content:
              content = content.replace(old, new)
              with open('makefile', 'w') as f:
                  f.write(content)
              print("Patched makefile: classpath-jar.o via ld -r -sectcreate")
          else:
              print("WARNING: makefile pattern not found, skipping patch")

          # Patch boot.cpp to use getsectdata() (Apple API) instead of the
          # _binary_classpath_jar_start/_end symbols.
          with open('src/boot.cpp', 'r') as f:
              boot = f.read()
          old_boot = """extern "C" {
extern const uint8_t SYMBOL(start)[];
extern const uint8_t SYMBOL(end)[];

AVIAN_EXPORT const uint8_t* classpathJar(size_t* size)
{
  *size = SYMBOL(end) - SYMBOL(start);
  return SYMBOL(start);
}
}"""
          new_boot = """#if defined(__APPLE__)
#include <mach-o/getsect.h>
extern "C" {
AVIAN_EXPORT const uint8_t* classpathJar(size_t* size)
{
  unsigned long s = 0;
  const uint8_t* p = getsectdata("__TEXT", "__kudroid_classpath", &s);
  if (size) *size = s;
  return p;
}
}
#else
extern "C" {
extern const uint8_t SYMBOL(start)[];
extern const uint8_t SYMBOL(end)[];

AVIAN_EXPORT const uint8_t* classpathJar(size_t* size)
{
  *size = SYMBOL(end) - SYMBOL(start);
  return SYMBOL(start);
}
}
#endif"""
          if old_boot in boot:
              boot = boot.replace(old_boot, new_boot)
              with open('src/boot.cpp', 'w') as f:
                  f.write(boot)
              print("Patched boot.cpp: classpathJar via getsectdata")
          else:
              print("WARNING: boot.cpp pattern not found, skipping patch")
          PYEOF
          make platform=ios arch=arm64 use-clang=true

      - name: Verify Avian build output
        run: |
          echo "=== Avian build dir ==="
          ls -lh third_party/jvm/avian/build/
          echo "=== Static library ==="
          find third_party/jvm/avian/build -name '*.a' -exec file {} \;
          echo "=== Bootimage ==="
          find third_party/jvm/avian/build -name 'bootimage*' -o -name '*.bin' | head -20

      - name: Upload Avian iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: avian-ios-arm64
          path: |
            third_party/jvm/avian/build/
            third_party/jvm/avian/include/
          retention-days: 90
