name: Build Avian JVM (iOS)

# Builds the Avian JVM for iOS ARM64 and uploads the static library +
# bootimage as an artifact. This replaces the miniJVM dependency.
#
# Avian uses its own Makefile (not CMake). It needs:
#   - macOS runner (has Xcode + iPhoneOS SDK)
#   - A JDK (JAVA_HOME) to build the bootimage (javac/jar)
#
# Usage: make platform=ios arch=arm64 use-clang=true

on:
  workflow_dispatch:
  push:
    paths:
      - 'third_party/jvm/avian/**'
      - '.github/workflows/build-avian.yml'

jobs:
  build-avian-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'
          # Avian's classpath build uses `javac -source 1` which was removed
          # in JDK 9+. JDK 8 is required to build the bootimage/classpath.
          # Zulu provides JDK 8 for macOS ARM64 (Temurin does not).

      - name: Verify toolchain
        run: |
          echo "=== Xcode ==="
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "=== JDK ==="
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Cache Avian build
        id: avian-cache
        uses: actions/cache@v4
        with:
          path: third_party/jvm/avian/build
          key: avian-ios-arm64-${{ runner.os }}-v5-definitive-${{ hashFiles('scripts/patch-avian-ios.py', 'third_party/jvm/avian/**') }}
          restore-keys: |
            avian-ios-arm64-${{ runner.os }}-v5-definitive-

      - name: Build KuDroid framework jar
        run: |
          bash framework/build.sh
          ls -lh framework/build/framework.jar

      - name: Build Avian for iOS ARM64
        working-directory: third_party/jvm/avian
        run: |
          # Patch makefile for iOS (binaryToObject fails on macho; embed the
          # classpath jar via .incbin and merge the framework classes in).
          python3 "$GITHUB_WORKSPACE/scripts/patch-avian-ios.py"
          make platform=ios arch=arm64 use-clang=true mode=debug-fast

      - name: Verify Avian build output
        run: |
          echo "=== Avian build dir ==="
          ls -lh third_party/jvm/avian/build/
          echo "=== Static library ==="
          find third_party/jvm/avian/build -name '*.a' -exec file {} \;
          echo "=== Bootimage ==="
          find third_party/jvm/avian/build -name 'bootimage*' -o -name '*.bin' | head -20

      - name: Upload Avian iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: avian-ios-arm64
          path: |
            third_party/jvm/avian/build/
            third_party/jvm/avian/include/
          retention-days: 90
