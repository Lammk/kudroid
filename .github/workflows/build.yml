name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build-linux

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build-macos-arm64

      - name: Configure (ARM64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

  # ─────────────────────────────────────────────────────────────────────────────
  # ANGLE iOS ARM64 — built in its own job with aggressive cache.
  # ANGLE is huge (~1600 CXX files); GitHub Actions free runners only have
  # ~7 GB RAM and 2-3 cores, so we limit parallelism to avoid OOM kills.
  # The built libs are uploaded as an artifact and cached across runs.
  # ─────────────────────────────────────────────────────────────────────────────
  build-angle-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Cache the final ANGLE static libs + headers so we skip the build entirely
      # on subsequent runs (as long as the script and pinned commit are unchanged).
      - name: Cache ANGLE built artifacts
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: third_party/ANGLE
          key: angle-ios-arm64-built-${{ runner.os }}-${{ hashFiles('scripts/fetch-build-angle-ios.sh') }}
          restore-keys: |
            angle-ios-arm64-built-${{ runner.os }}-

      # Also cache the massive source checkout + depot_tools to speed up rebuilds.
      - name: Cache ANGLE source and depot_tools
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            third_party/angle-src
            third_party/build-tools
          key: angle-ios-src-${{ runner.os }}-${{ hashFiles('scripts/fetch-build-angle-ios.sh') }}
          restore-keys: |
            angle-ios-src-${{ runner.os }}-

      - name: Build ANGLE (Vulkan backend, iOS ARM64)
        if: false
        env:
          # Limit ninja parallelism to 2 jobs so peak RSS stays under ~7 GB.
          # ANGLE .cc files individually can use 1–2 GB during compilation.
          NINJA_JOBS: 2
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          chmod +x scripts/fetch-build-angle-ios.sh
          # Patch autoninja call to respect our parallelism limit
          sed -i '' "s|autoninja -C|ninja -j${NINJA_JOBS} -C|g" scripts/fetch-build-angle-ios.sh
          ./scripts/fetch-build-angle-ios.sh

      - name: Verify ANGLE build output
        run: |
          echo "=== ANGLE libs ==="
          ls -lh third_party/ANGLE/lib/ios-arm64/
          file third_party/ANGLE/lib/ios-arm64/libEGL.a
          file third_party/ANGLE/lib/ios-arm64/libGLESv2.a

      - name: Upload ANGLE artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-arm64
          path: third_party/ANGLE
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # Build test .so files (ARM64 cross-compile on Ubuntu — fast & cheap)
  # ─────────────────────────────────────────────────────────────────────────────
  build-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build test_lib.so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -o tests/test_lib_arm64.so tests/test_lib.c
          aarch64-linux-gnu-strip tests/test_lib_arm64.so

      - name: Verify ARM64 ELF
        run: |
          file tests/test_lib_arm64.so
          readelf -h tests/test_lib_arm64.so | grep -E "Class|Machine"

      - name: Upload test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-lib-arm64-so
          path: tests/test_lib_arm64.so

  build-bionic-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Bionic shim test .so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -pthread \
            -o tests/test_bionic_lib_arm64.so tests/test_bionic_lib.c
          aarch64-linux-gnu-strip tests/test_bionic_lib_arm64.so

      - name: Verify Bionic test ELF
        run: |
          file tests/test_bionic_lib_arm64.so
          readelf -h tests/test_bionic_lib_arm64.so | grep -E "Class|Machine"
          readelf --dyn-syms tests/test_bionic_lib_arm64.so | grep -E "kudroid_bionic_test|__android_log_print"

      - name: Upload Bionic test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-bionic-lib-arm64-so
          path: tests/test_bionic_lib_arm64.so

  build-multi-elf-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build provider and consumer ELF pair
        run: |
          mkdir -p tests/multi-elf-build
          aarch64-linux-gnu-gcc -shared -fPIC \
            -Wl,-soname,libkudroid_provider.so \
            -o tests/multi-elf-build/libkudroid_provider.so \
            tests/multi_elf_provider.c
          aarch64-linux-gnu-gcc -shared -fPIC -pthread \
            -Ltests/multi-elf-build -Wl,-rpath,'$ORIGIN' \
            -Wl,-soname,libkudroid_consumer.so \
            -o tests/multi-elf-build/libkudroid_consumer.so \
            tests/multi_elf_consumer.c -lkudroid_provider
          aarch64-linux-gnu-strip tests/multi-elf-build/*.so
          cp tests/multi-elf-build/libkudroid_provider.so tests/libkudroid_provider_arm64.so
          cp tests/multi-elf-build/libkudroid_consumer.so tests/libkudroid_consumer_arm64.so

      - name: Verify Multi-ELF dependency
        run: |
          file tests/libkudroid_provider_arm64.so tests/libkudroid_consumer_arm64.so
          readelf -d tests/libkudroid_consumer_arm64.so | grep NEEDED
          readelf --wide --dyn-syms tests/libkudroid_consumer_arm64.so | grep kudroid_dependency_value

      - name: Upload Multi-ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-elf-arm64-so
          path: |
            tests/libkudroid_provider_arm64.so
            tests/libkudroid_consumer_arm64.so

  build-gpu-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build GPU test .so files (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -ldl \
            -o tests/test_gpu_vulkan_arm64.so tests/test_gpu_vulkan.c
          aarch64-linux-gnu-gcc -shared -fPIC -ldl \
            -o tests/test_gpu_opengl_arm64.so tests/test_gpu_opengl.c
          aarch64-linux-gnu-strip tests/test_gpu_vulkan_arm64.so
          aarch64-linux-gnu-strip tests/test_gpu_opengl_arm64.so

      - name: Verify GPU test ELFs
        run: |
          file tests/test_gpu_vulkan_arm64.so tests/test_gpu_opengl_arm64.so
          readelf -h tests/test_gpu_vulkan_arm64.so | grep -E "Class|Machine"
          readelf --dyn-syms tests/test_gpu_vulkan_arm64.so | grep -E "kudroid_gpu_vulkan_test|dlopen|dlsym"
          readelf --dyn-syms tests/test_gpu_opengl_arm64.so | grep -E "kudroid_gpu_opengl_test|dlopen|dlsym"

      - name: Upload GPU test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: gpu-test-arm64-so
          path: |
            tests/test_gpu_vulkan_arm64.so
            tests/test_gpu_opengl_arm64.so

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS Build — downloads pre-built ANGLE + MoltenVK, compiles only kudroid_core
  # and the SwiftUI shell.
  # ─────────────────────────────────────────────────────────────────────────────
  ios-build:
    needs: [build-multi-elf-so-arm64, build-gpu-test-so-arm64]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore ANGLE pre-built artifacts from cache
        uses: actions/cache/restore@v4
        with:
          path: third_party/ANGLE
          key: angle-ios-arm64-built-macOS-
          restore-keys: |
            angle-ios-arm64-built-macOS-

      - name: Install MoltenVK (prebuilt release download)
        run: |
          chmod +x scripts/fetch-moltenvk-ios.sh
          ./scripts/fetch-moltenvk-ios.sh

      - name: Verify graphics dependencies
        run: |
          echo "=== ANGLE ==="
          ls -lh third_party/ANGLE/lib/ios-arm64/
          echo "=== MoltenVK ==="
          ls -lh third_party/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a

      - name: Download Multi-ELF ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: multi-elf-arm64-so
          path: multi-elf-artifact

      - name: Download GPU test ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: gpu-test-arm64-so
          path: gpu-test-artifact

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ios-build

      - name: Build kudroid_core static library (iOS ARM64)
        run: |
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ios --parallel
          cmake --build build-ios --parallel --target mini_jvm_lib

      - name: Compile Swift app + link kudroid_core (unsigned .app)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p KuDroidShell.app

          mkdir -p tests
          cp multi-elf-artifact/libkudroid_provider_arm64.so tests/libkudroid_provider_arm64.so
          cp multi-elf-artifact/libkudroid_consumer_arm64.so tests/libkudroid_consumer_arm64.so

          # Copy pre-built ARM64 test .so from repo into app bundle
          if [ -f tests/test_lib_arm64.so ]; then
            cp tests/test_lib_arm64.so KuDroidShell.app/test_lib.so
            echo "Bundled ARM64 test_lib.so ($(wc -c < KuDroidShell.app/test_lib.so) bytes)"
          else
            echo "ERROR: tests/test_lib_arm64.so not found in repo!"
            echo "Download it from build-test-so-arm64 artifact and commit to tests/"
            exit 1
          fi

          if [ -f tests/test_bionic_lib_arm64.so ]; then
            cp tests/test_bionic_lib_arm64.so KuDroidShell.app/test_bionic_lib.so
            echo "Bundled ARM64 test_bionic_lib.so ($(wc -c < KuDroidShell.app/test_bionic_lib.so) bytes)"
          else
            echo "ERROR: tests/test_bionic_lib_arm64.so not found in repo!"
            echo "Download it from test-bionic-lib-arm64-so artifact and commit to tests/"
            exit 1
          fi

          if [ -f tests/libkudroid_provider_arm64.so ] && [ -f tests/libkudroid_consumer_arm64.so ]; then
            cp tests/libkudroid_provider_arm64.so KuDroidShell.app/libkudroid_provider.so
            cp tests/libkudroid_consumer_arm64.so KuDroidShell.app/libkudroid_consumer.so
            echo "Bundled Multi-ELF provider and consumer libraries"
          else
            echo "ERROR: Multi-ELF provider/consumer libraries not found in repo!"
            exit 1
          fi

          # Bundle GPU test .so files
          if [ -f gpu-test-artifact/test_gpu_vulkan_arm64.so ]; then
            cp gpu-test-artifact/test_gpu_vulkan_arm64.so KuDroidShell.app/test_gpu_vulkan.so
            echo "Bundled test_gpu_vulkan.so ($(wc -c < KuDroidShell.app/test_gpu_vulkan.so) bytes)"
          else
            echo "WARNING: test_gpu_vulkan_arm64.so not found, skipping"
          fi
          if [ -f gpu-test-artifact/test_gpu_opengl_arm64.so ]; then
            cp gpu-test-artifact/test_gpu_opengl_arm64.so KuDroidShell.app/test_gpu_opengl.so
            echo "Bundled test_gpu_opengl.so ($(wc -c < KuDroidShell.app/test_gpu_opengl.so) bytes)"
          else
            echo "WARNING: test_gpu_opengl_arm64.so not found, skipping"
          fi

          # Ensure dylibs exist for -lEGL -lGLESv2
          if [ -d third_party/ANGLE/lib/ios-arm64/libEGL.framework ] && [ ! -f third_party/ANGLE/lib/ios-arm64/libEGL.dylib ]; then
            cp third_party/ANGLE/lib/ios-arm64/libEGL.framework/libEGL third_party/ANGLE/lib/ios-arm64/libEGL.dylib
          fi
          if [ -d third_party/ANGLE/lib/ios-arm64/libGLESv2.framework ] && [ ! -f third_party/ANGLE/lib/ios-arm64/libGLESv2.dylib ]; then
            cp third_party/ANGLE/lib/ios-arm64/libGLESv2.framework/libGLESv2 third_party/ANGLE/lib/ios-arm64/libGLESv2.dylib
          fi

          echo "=== DIAGNOSTICS: ALL .a FILES IN WORKSPACE ==="
          find . -type f -name "*.a"
          echo "=== DIAGNOSTICS: ALL FILES MATCHING mini_jvm ==="
          find . -type f -name "*mini_jvm*"
          
          MINI_JVM_LIB=$(find . -name "libmini_jvm_lib.a" | head -n 1)
          if [ -z "$MINI_JVM_LIB" ]; then
            echo "ERROR: libmini_jvm_lib.a not found!"
            exit 1
          fi
          echo "Found miniJVM at: $MINI_JVM_LIB"

          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 \
            -O -parse-as-library \
            -import-objc-header ios-app/KuDroidShell/kudroid_bridge.h \
            ios-app/KuDroidShell/KuDroidApp.swift \
            ios-app/KuDroidShell/ContentView.swift \
            build-ios/libkudroid_core.a \
            "$MINI_JVM_LIB" \
            -Lthird_party/ANGLE/lib/ios-arm64 \
            -lEGL -lGLESv2 \
            third_party/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a \
            -lz \
            -framework Metal \
            -framework QuartzCore \
            -framework Foundation \
            -framework UIKit \
            -framework CoreGraphics \
            -framework IOSurface \
            -o KuDroidShell.app/KuDroidShell

          # Embed ANGLE dynamic frameworks into the app bundle so dyld finds them at runtime
          mkdir -p KuDroidShell.app/Frameworks
          if [ -d third_party/ANGLE/lib/ios-arm64/libEGL.framework ]; then
            cp -R third_party/ANGLE/lib/ios-arm64/libEGL.framework KuDroidShell.app/Frameworks/
          fi
          if [ -d third_party/ANGLE/lib/ios-arm64/libGLESv2.framework ]; then
            cp -R third_party/ANGLE/lib/ios-arm64/libGLESv2.framework KuDroidShell.app/Frameworks/
          fi

          cat > KuDroidShell.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KuDroidShell</string>
              <key>CFBundleIdentifier</key>
              <string>dev.kuzei13.kudroid</string>
              <key>CFBundleName</key>
              <string>KuDroid</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleIcons</key>
              <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                      <key>CFBundleIconFiles</key>
                      <array>
                          <string>AppIcon</string>
                      </array>
                  </dict>
              </dict>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          PLIST

      - name: Add App Icon
        run: |
          cp icon.png KuDroidShell.app/AppIcon60x60@2x.png
          cp icon.png KuDroidShell.app/AppIcon60x60@3x.png
          cp icon.png KuDroidShell.app/AppIcon.png

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R KuDroidShell.app Payload/
          zip -r KuDroidShell.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudroid-ios-unsigned
          path: |
            KuDroidShell.ipa
            build-ios/libkudroid_core.a