name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ ccache zip

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build-linux

      - name: Clean stale CMake cache
        run: rm -rf build build-ios build-test

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build Kudroid
        run: cmake --build build --parallel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-build-macos-arm64

      - name: Clean stale CMake cache
        run: rm -rf build build-ios build-test

      - name: Configure (ARM64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel

  # ─────────────────────────────────────────────────────────────────────────────
  # ANGLE iOS ARM64 — built in its own job with aggressive cache.
  # ANGLE is huge (~1600 CXX files); GitHub Actions free runners only have
  # ~7 GB RAM and 2-3 cores, so we limit parallelism to avoid OOM kills.
  # The built libs are uploaded as an artifact and cached across runs.
  # ─────────────────────────────────────────────────────────────────────────────
  build-angle-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Cache the final ANGLE static libs + headers so we skip the build entirely
      # on subsequent runs (as long as the script and pinned commit are unchanged).
      - name: Cache ANGLE built artifacts
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: third_party/ANGLE
          key: angle-ios-arm64-built-${{ runner.os }}-${{ hashFiles('scripts/fetch-build-angle-ios.sh') }}
          restore-keys: |
            angle-ios-arm64-built-${{ runner.os }}-

      # Also cache the massive source checkout + depot_tools to speed up rebuilds.
      - name: Cache ANGLE source and depot_tools
        if: steps.angle-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            third_party/angle-src
            third_party/build-tools
          key: angle-ios-src-${{ runner.os }}-${{ hashFiles('scripts/fetch-build-angle-ios.sh') }}
          restore-keys: |
            angle-ios-src-${{ runner.os }}-

      - name: Build ANGLE (Vulkan backend, iOS ARM64)
        if: steps.angle-cache.outputs.cache-hit != 'true'
        env:
          # Limit ninja parallelism to 2 jobs so peak RSS stays under ~7 GB.
          # ANGLE .cc files individually can use 1–2 GB during compilation.
          NINJA_JOBS: 2
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          chmod +x scripts/fetch-build-angle-ios.sh
          # Patch autoninja call to respect our parallelism limit
          sed -i '' "s|autoninja -C|ninja -j${NINJA_JOBS} -C|g" scripts/fetch-build-angle-ios.sh
          ./scripts/fetch-build-angle-ios.sh

      - name: Verify ANGLE build output
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: |
          echo "=== ANGLE libs ==="
          ls -lh third_party/ANGLE/lib/ios-arm64/ || { echo "ANGLE libs missing — cache miss and build skipped"; exit 1; }
          file third_party/ANGLE/lib/ios-arm64/libEGL.a
          file third_party/ANGLE/lib/ios-arm64/libGLESv2.a

      - name: Upload ANGLE artifact
        uses: actions/upload-artifact@v4
        with:
          name: angle-ios-arm64
          path: third_party/ANGLE
  # ─────────────────────────────────────────────────────────────────────────────
  # Avian JVM — build for iOS ARM64 (needed by kudroid_core).
  # Uses JDK 8 (Zulu) because Avian's classpath build uses `javac -source 1`.
  # ─────────────────────────────────────────────────────────────────────────────
  build-avian-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '8'

      - name: Build KuDroid framework jar
        run: |
          bash framework/build.sh
          ls -lh framework/build/framework.jar

      - name: Build Avian for iOS ARM64
        working-directory: third_party/jvm/avian
        run: |
          # Patch makefile for iOS (binaryToObject fails on macho; embed the
          # classpath jar via .incbin and merge the framework classes in).
          python3 "$GITHUB_WORKSPACE/scripts/patch-avian-ios.py"
          make platform=ios arch=arm64 use-clang=true

      - name: Upload Avian iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: avian-ios-arm64
          path: |
            third_party/jvm/avian/build/
            third_party/jvm/avian/include/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS Build — downloads pre-built ANGLE + MoltenVK, compiles only kudroid_core
  # and the SwiftUI shell.
  # ─────────────────────────────────────────────────────────────────────────────
  ios-build:
    needs: [build-angle-ios, build-avian-ios]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # Always download the ANGLE artifact built by build-angle-ios so the iOS
      # build always has ANGLE available (independent of cache state).
      - name: Download ANGLE artifact
        uses: actions/download-artifact@v4
        with:
          name: angle-ios-arm64
          path: third_party/ANGLE

      - name: Install MoltenVK (prebuilt release download)
        run: |
          chmod +x scripts/fetch-moltenvk-ios.sh
          ./scripts/fetch-moltenvk-ios.sh

      - name: Verify graphics dependencies
        run: |
          echo "=== ANGLE ==="
          ls -lh third_party/ANGLE/lib/ios-arm64/
          echo "=== MoltenVK ==="
          ls -lh third_party/MoltenVK/MoltenVK/static/MoltenVK.xcframework/ios-arm64/libMoltenVK.a

      - name: Download Avian iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: avian-ios-arm64
          path: avian-artifact

      - name: Install Avian static library
        run: |
          # Copy libavian.a to where CMake expects it.
          mkdir -p third_party/jvm/avian/build
          find avian-artifact -name 'libavian.a' -exec cp {} third_party/jvm/avian/build/libavian.a \;
          ls -lh third_party/jvm/avian/build/libavian.a

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ios-build

      - name: Clean stale CMake cache
        run: rm -rf build build-ios build-test

      - name: Build kudroid_core static library (iOS ARM64)
        run: |
          # Use the Xcode generator so Swift (KuDroidShell app) is supported.
          cmake -B build-ios -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build-ios --config Release --parallel

          # The Xcode generator build already produced the app bundle.
          # Move it to the expected location FIRST so we can bundle .so files.
          mv build-ios/Release-iphoneos/KuDroidShell.app KuDroidShell.app

          # Run asset bundling script
          bash scripts/bundle_assets.sh          


      - name: Add App Icon
        run: |
          cp icon.png KuDroidShell.app/AppIcon60x60@2x.png
          cp icon.png KuDroidShell.app/AppIcon60x60@3x.png
          cp icon.png KuDroidShell.app/AppIcon.png

      - name: Embed JIT entitlements for sideload
        run: |
          # Copy the entitlements into the app bundle so sideload tools
          # (e.g. ldid, Sideloadly, AltStore) can sign with them.
          cp ios-app/entitlements.plist KuDroidShell.app/entitlements.plist
          echo "Embedded entitlements.plist into app bundle"

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R KuDroidShell.app Payload/
          zip -r KuDroidShell.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudroid-ios-unsigned
          path: |
            KuDroidShell.ipa
            build-ios/Release-iphoneos/libkudroid_core.a