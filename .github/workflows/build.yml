name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ARM64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

  ios-build:
    needs: build-multi-elf-so-arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Download Multi-ELF ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: multi-elf-arm64-so
          path: multi-elf-artifact

      - name: Build kudroid_core static library (iOS ARM64)
        run: |
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios --parallel

      - name: Compile Swift app + link kudroid_core (unsigned .app)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p KuDroidShell.app

          mkdir -p tests
          cp multi-elf-artifact/libkudroid_provider_arm64.so tests/libkudroid_provider_arm64.so
          cp multi-elf-artifact/libkudroid_consumer_arm64.so tests/libkudroid_consumer_arm64.so

          # Copy pre-built ARM64 test .so from repo into app bundle
          if [ -f tests/test_lib_arm64.so ]; then
            cp tests/test_lib_arm64.so KuDroidShell.app/test_lib.so
            echo "Bundled ARM64 test_lib.so ($(wc -c < KuDroidShell.app/test_lib.so) bytes)"
          else
            echo "ERROR: tests/test_lib_arm64.so not found in repo!"
            echo "Download it from build-test-so-arm64 artifact and commit to tests/"
            exit 1
          fi

          if [ -f tests/test_bionic_lib_arm64.so ]; then
            cp tests/test_bionic_lib_arm64.so KuDroidShell.app/test_bionic_lib.so
            echo "Bundled ARM64 test_bionic_lib.so ($(wc -c < KuDroidShell.app/test_bionic_lib.so) bytes)"
          else
            echo "ERROR: tests/test_bionic_lib_arm64.so not found in repo!"
            echo "Download it from test-bionic-lib-arm64-so artifact and commit to tests/"
            exit 1
          fi

          if [ -f tests/libkudroid_provider_arm64.so ] && [ -f tests/libkudroid_consumer_arm64.so ]; then
            cp tests/libkudroid_provider_arm64.so KuDroidShell.app/libkudroid_provider.so
            cp tests/libkudroid_consumer_arm64.so KuDroidShell.app/libkudroid_consumer.so
            echo "Bundled Multi-ELF provider and consumer libraries"
          else
            echo "ERROR: Multi-ELF provider/consumer libraries not found in repo!"
            exit 1
          fi

          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 \
            -O -parse-as-library \
            -import-objc-header ios-app/KuDroidShell/kudroid_bridge.h \
            ios-app/KuDroidShell/KuDroidApp.swift \
            ios-app/KuDroidShell/ContentView.swift \
            build-ios/libkudroid_core.a \
            -o KuDroidShell.app/KuDroidShell

          cat > KuDroidShell.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KuDroidShell</string>
              <key>CFBundleIdentifier</key>
              <string>dev.kuzei13.kudroid</string>
              <key>CFBundleName</key>
              <string>KuDroid</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          PLIST

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R KuDroidShell.app Payload/
          zip -r KuDroidShell.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudroid-ios-unsigned
          path: |
            KuDroidShell.ipa
            build-ios/libkudroid_core.a

  build-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build test_lib.so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -o tests/test_lib_arm64.so tests/test_lib.c
          aarch64-linux-gnu-strip tests/test_lib_arm64.so

      - name: Verify ARM64 ELF
        run: |
          file tests/test_lib_arm64.so
          readelf -h tests/test_lib_arm64.so | grep -E "Class|Machine"

      - name: Upload test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-lib-arm64-so
          path: tests/test_lib_arm64.so

  build-bionic-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build Bionic shim test .so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -pthread \
            -o tests/test_bionic_lib_arm64.so tests/test_bionic_lib.c
          aarch64-linux-gnu-strip tests/test_bionic_lib_arm64.so

      - name: Verify Bionic test ELF
        run: |
          file tests/test_bionic_lib_arm64.so
          readelf -h tests/test_bionic_lib_arm64.so | grep -E "Class|Machine"
          readelf --dyn-syms tests/test_bionic_lib_arm64.so | grep -E "kudroid_bionic_test|__android_log_print"

      - name: Upload Bionic test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-bionic-lib-arm64-so
          path: tests/test_bionic_lib_arm64.so

  build-multi-elf-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build provider and consumer ELF pair
        run: |
          mkdir -p tests/multi-elf-build
          aarch64-linux-gnu-gcc -shared -fPIC \
            -Wl,-soname,libkudroid_provider.so \
            -o tests/multi-elf-build/libkudroid_provider.so \
            tests/multi_elf_provider.c
          aarch64-linux-gnu-gcc -shared -fPIC -pthread \
            -Ltests/multi-elf-build -Wl,-rpath,'$ORIGIN' \
            -Wl,-soname,libkudroid_consumer.so \
            -o tests/multi-elf-build/libkudroid_consumer.so \
            tests/multi_elf_consumer.c -lkudroid_provider
          aarch64-linux-gnu-strip tests/multi-elf-build/*.so
          cp tests/multi-elf-build/libkudroid_provider.so tests/libkudroid_provider_arm64.so
          cp tests/multi-elf-build/libkudroid_consumer.so tests/libkudroid_consumer_arm64.so

      - name: Verify Multi-ELF dependency
        run: |
          file tests/libkudroid_provider_arm64.so tests/libkudroid_consumer_arm64.so
          readelf -d tests/libkudroid_consumer_arm64.so | grep NEEDED
          readelf --wide --dyn-syms tests/libkudroid_consumer_arm64.so | grep kudroid_dependency_value

      - name: Upload Multi-ELF artifact
        uses: actions/upload-artifact@v4
        with:
          name: multi-elf-arm64-so
          path: |
            tests/libkudroid_provider_arm64.so
            tests/libkudroid_consumer_arm64.so