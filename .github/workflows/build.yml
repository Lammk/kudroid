name: Build

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure (ARM64)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

  ios-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build kudroid_core static library (iOS ARM64)
        run: |
          cmake -B build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ios --parallel

      - name: Build test_lib ARM64 .so
        run: |
          clang -shared -fPIC -arch arm64 \
            -o tests/test_lib_arm64.so tests/test_lib.c
          strip tests/test_lib_arm64.so
          file tests/test_lib_arm64.so

      - name: Compile Swift app + link kudroid_core (unsigned .app)
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          mkdir -p KuDroidShell.app

          # Copy ARM64 test .so into app bundle
          cp tests/test_lib_arm64.so KuDroidShell.app/test_lib.so
          echo "Bundled ARM64 test_lib.so ($(wc -c < KuDroidShell.app/test_lib.so) bytes)"

          swiftc -sdk "$SDK" -target arm64-apple-ios15.0 \
            -O -parse-as-library \
            -import-objc-header ios-app/KuDroidShell/kudroid_bridge.h \
            ios-app/KuDroidShell/KuDroidApp.swift \
            ios-app/KuDroidShell/ContentView.swift \
            build-ios/libkudroid_core.a \
            -o KuDroidShell.app/KuDroidShell

          cat > KuDroidShell.app/Info.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>KuDroidShell</string>
              <key>CFBundleIdentifier</key>
              <string>dev.kuzei13.kudroid</string>
              <key>CFBundleName</key>
              <string>KuDroid</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>0.1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
          </dict>
          </plist>
          PLIST

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R KuDroidShell.app Payload/
          zip -r KuDroidShell.ipa Payload
          rm -rf Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kudroid-ios-unsigned
          path: |
            KuDroidShell.ipa
            build-ios/libkudroid_core.a

  build-test-so-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build test_lib.so (ARM64)
        run: |
          aarch64-linux-gnu-gcc -shared -fPIC -o tests/test_lib_arm64.so tests/test_lib.c
          aarch64-linux-gnu-strip tests/test_lib_arm64.so

      - name: Verify ARM64 ELF
        run: |
          file tests/test_lib_arm64.so
          readelf -h tests/test_lib_arm64.so | grep -E "Class|Machine"

      - name: Upload test .so artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-lib-arm64-so
          path: tests/test_lib_arm64.so